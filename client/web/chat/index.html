<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Akasha · 二游垂直 AI 工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238aa4ff'/%3E%3Cpath d='M9 12h14M9 16h10M9 20h6' stroke='%230f1115' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <!-- theme.js 要**同步**执行（不加 defer），并且放在 body 之前：
       主题必须在首帧前定下来，否则会先闪一下深色/浅色。 -->
  <script src="/theme.js"></script>
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <div class="side-head">
        <button class="new" id="new">
          <span class="ico">＋</span> 新对话
        </button>
      </div>
      <!-- 一级导航。技能与对话平级，不是藏在浮层里的按钮 ——
           用户第一次打开就该看见「这东西能干什么」，而不是一个光秃秃的输入框。 -->
      <nav class="side-nav" id="side-nav" aria-label="主导航">
        <button class="nav-i on" data-nav="chat"><span class="ni">💬</span>对话</button>
        <button class="nav-i" data-nav="skills"><span class="ni">✦</span>技能<span class="nc" id="nav-skill-count"></span></button>
      </nav>
      <nav class="convos" id="convos" aria-label="会话列表"></nav>
      <div class="side-foot">
        <span class="dot" id="dot"></span>
        <span class="foot-text" id="model">连接中…</span>
      </div>
    </aside>

    <main class="main" id="main" data-view="chat">
      <header class="top">
        <button class="icon only-narrow" id="menu" title="会话列表" aria-label="会话列表">☰</button>
        <h1 id="title">新对话</h1>
        <span class="spacer"></span>
        <span class="pill" id="provider" hidden></span>
        <!-- ⚠ 这里原本有一个 🏛 图标：<a id="kb-link" href="/kb/" target="_blank">。
             它是"点开知识库本体"的入口之一 —— 已删除。
             客户端不得以任何形式直接访问知识库全部内容，界面上就不该出现这种按钮。
             自己要翻库用浏览器开 http://127.0.0.1:5178。 -->
        <button class="icon" id="reset" title="清空本会话的服务端上下文">↺</button>
        <!-- 明暗切换。默认跟系统走，点了就记住选择。 -->
        <button class="icon" id="theme" title="切换深色 / 浅色" aria-label="切换主题" aria-pressed="false">🌙</button>
      </header>

      <div class="log" id="log" role="log" aria-live="polite"></div>

      <!-- 技能视图：与对话并列的一屏，不是浮层。
           点某个技能就跑它（切回对话并发出去）。 -->
      <div class="view" id="view-skills" hidden></div>

      <footer class="composer">
        <!-- 已选技能。点技能卡 → 技能出现在这里 → 用户再打字说要件。
             技能是**模式**不是快捷问题：选了「角色档案」是要问「钟离是谁」，
             不该替用户发一条写死的「胡桃是谁」。 -->
        <div class="picked" id="picked" hidden>
          <span class="picked-ico" id="picked-ico"></span>
          <span class="picked-name" id="picked-name"></span>
          <button class="picked-x" id="picked-x" title="取消这个技能">✕</button>
        </div>
        <div class="box">
          <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送，Shift + Enter 换行）"
                    autocomplete="off" spellcheck="false"></textarea>
          <button class="send" id="send" title="发送" aria-label="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M4 12l15-7-6.2 15-2.1-6.1L4 12z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <div class="composer-foot">
          <button class="chip" id="think" aria-pressed="false" title="深度思考：关（快速作答）">💡 深度思考 · 关</button>
          <!-- 练度规划是**说话触发**的技能，不是藏在图标后面的开关。
               这里把它讲出来，否则用户不会知道能这么问。 -->
          <span class="muted" id="hint">结论逐条可回溯官方原文 · 试试「胡桃80级练到90要什么」</span>
        </div>
      </footer>
    </main>
  </div>
  <link rel="stylesheet" href="/media.css">
  <link rel="stylesheet" href="/planner.css">
  <link rel="stylesheet" href="/skills.css">
  <script src="/media.js"></script>
  <!-- 都要在 app.js 之前：app.js 的空状态会在渲染时读
       window.AkashaSkills / window.AkashaPlanner（与 AkashaMedia 同一个挂法）。 -->
  <script src="/skills.js"></script>
  <script src="/planner.js"></script>
  <script src="/app.js"></script>
</body>
</html>
