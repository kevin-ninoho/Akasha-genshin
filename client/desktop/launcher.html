<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Akasha · 启动中</title>
<style>
  :root{
    --bg:#07090f; --ink:#eff3fb; --mut:#8b97a8;
    --el:#8aa4ff;                 /* 当前七神的元素色，会随轮播切换 */
    --gold:#e8b23a; --ok:#7ed0a8;
    --ease:cubic-bezier(.22,.8,.26,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
    font:14px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none}

  /* ── 立绘层 ─────────────────────────────────────── */
  #stage{position:fixed;inset:0;overflow:hidden}
  .art{position:absolute;inset:-8%;opacity:0;
    background-position:center 12%;background-repeat:no-repeat;background-size:contain;
    transition:opacity 1.5s var(--ease);will-change:transform,opacity;
    filter:drop-shadow(0 0 90px color-mix(in srgb, var(--el) 45%, transparent))}
  .art.on{opacity:.62;animation:kb 11s ease-out forwards}
  @keyframes kb{0%{transform:scale(1.05) translate3d(0,0,0)}100%{transform:scale(1.17) translate3d(-1.6%,-1.4%,0)}}

  .veil{position:fixed;inset:0;pointer-events:none;transition:background .6s var(--ease);
    background:
      radial-gradient(120% 85% at 50% 8%, color-mix(in srgb, var(--el) 16%, transparent), transparent 62%),
      radial-gradient(95% 70% at 50% 112%, rgba(7,9,15,.97), rgba(7,9,15,.6) 55%),
      linear-gradient(180deg, rgba(7,9,15,.66), rgba(7,9,15,.5) 34%, rgba(7,9,15,.94))}

  /* ── 布局 ───────────────────────────────────────── */
  main{position:relative;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:4vh 28px;
    animation:fadein .9s var(--ease) both}
  @keyframes fadein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .mark{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;
    background:linear-gradient(158deg, color-mix(in srgb, var(--el) 72%, #fff 8%), var(--el));
    box-shadow:0 16px 46px -12px color-mix(in srgb, var(--el) 78%, transparent);
    transition:background .9s var(--ease),box-shadow .9s var(--ease);
    animation:float 4.6s ease-in-out infinite}
  .mark svg{width:34px;height:34px}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  h1{margin:16px 0 0;font-size:33px;font-weight:700;letter-spacing:.05em;
    background:linear-gradient(92deg,#eff3fb 18%, var(--el) 46%, #eff3fb 74%);
    background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 4.6s linear infinite;transition:background .9s var(--ease)}
  @keyframes shimmer{to{background-position:-220% 0}}
  .sub{margin:5px 0 0;color:var(--mut);font-size:11.5px;letter-spacing:.26em}

  /* 当前七神 */
  .archon{margin-top:26px;text-align:center;min-height:64px;position:relative;isolation:isolate}
  /* 立绘换到亮部时文字会被吃掉，垫一层暗晕 */
  .archon::before{content:'';position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    width:min(560px,86vw);height:190px;z-index:-1;pointer-events:none;
    background:radial-gradient(closest-side, rgba(7,9,15,.86), rgba(7,9,15,.55) 55%, rgba(7,9,15,0))}
  .archon .god{font-size:27px;font-weight:700;letter-spacing:.12em;
    color:var(--el);
    text-shadow:0 2px 4px rgba(0,0,0,.9), 0 6px 26px rgba(0,0,0,.85),
                0 0 34px color-mix(in srgb, var(--el) 60%, transparent);
    transition:color .9s var(--ease),text-shadow .9s var(--ease)}
  .archon .nm{margin-top:4px;font-size:13px;color:#a8b4c6;letter-spacing:.16em;
    text-shadow:0 2px 8px rgba(0,0,0,.95)}
  .archon.swap{animation:swap .75s var(--ease)}
  @keyframes swap{0%{opacity:0;transform:translateY(9px) scale(.97);filter:blur(4px)}
                  100%{opacity:1;transform:none;filter:none}}

  /* 七国徽记 */
  .rail{margin-top:24px;display:flex;gap:clamp(8px,2.4vw,26px);align-items:flex-start}
  .rn{display:flex;flex-direction:column;align-items:center;gap:6px;
    font-size:11px;color:#59636f;letter-spacing:.08em;
    transition:color .6s var(--ease),transform .4s var(--ease)}
  .rn i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    border:1px solid #232b38;background:rgba(255,255,255,.02);
    font-style:normal;font-size:12px;color:#59636f;
    transition:all .6s var(--ease)}
  .rn.on{color:#eff3fb;transform:translateY(-3px)}
  .rn.on i{border-color:var(--c);color:var(--bg);background:var(--c);
    box-shadow:0 0 0 5px color-mix(in srgb, var(--c) 20%, transparent),
               0 8px 26px -8px var(--c)}
  .rn.locked i{border-style:dashed}
  .rn.locked.on i{background:transparent;color:var(--c)}

  /* 统计 */
  .stats{margin-top:34px;display:flex;gap:clamp(14px,3.4vw,42px);flex-wrap:wrap;justify-content:center}
  .st{min-width:82px;text-align:center}
  .st b{display:block;font-size:25px;font-weight:700;font-variant-numeric:tabular-nums}
  .st span{display:block;margin-top:1px;font-size:11px;color:var(--mut);letter-spacing:.1em}
  .st.hi b{color:var(--gold)}

  /* 阶段 */
  .stages{margin-top:36px;display:flex;align-items:center}
  .sg{display:flex;align-items:center;gap:8px;padding:0 15px;color:#5c6675;
    font-size:12.5px;transition:color .4s var(--ease)}
  .sg i{width:8px;height:8px;border-radius:50%;background:#2a3240;font-style:normal;
    transition:background .4s var(--ease),box-shadow .4s var(--ease)}
  .sg.doing{color:var(--ink)}
  .sg.doing i{background:var(--el);box-shadow:0 0 0 5px color-mix(in srgb, var(--el) 22%, transparent);
    animation:pulse 1.15s ease-in-out infinite}
  .sg.done{color:var(--ok)}
  .sg.done i{background:var(--ok);box-shadow:0 0 0 4px rgba(126,208,168,.14)}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}
  .sep{width:22px;height:1px;background:#202836}

  .bar{margin-top:20px;width:min(470px,72vw);height:3px;border-radius:3px;background:#171e29;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg, color-mix(in srgb, var(--el) 60%, #fff 10%), var(--el));
    transition:width .55s var(--ease),background .9s var(--ease)}
  .tip{margin-top:16px;font-size:12px;color:var(--mut);height:20px;letter-spacing:.04em}
  .foot{position:fixed;left:0;right:0;bottom:16px;text-align:center;
    font-size:11px;color:#4b5563;letter-spacing:.08em}

  body.out main{opacity:0;transform:scale(1.03);transition:opacity .5s var(--ease),transform .5s var(--ease)}
  body.out #stage,body.out .veil,body.out .foot{opacity:0;transition:opacity .5s var(--ease)}
</style>
</head>
<body>
<div id="stage"><div class="art" id="a0"></div><div class="art" id="a1"></div></div>
<div class="veil"></div>

<main>
  <div class="mark">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 5.6c0-.9.7-1.6 1.6-1.6H11v15H5.6c-.9 0-1.6-.7-1.6-1.6V5.6z" fill="#0b0e14" opacity=".9"/>
      <path d="M20 5.6c0-.9-.7-1.6-1.6-1.6H13v15h5.4c.9 0 1.6-.7 1.6-1.6V5.6z" fill="#0b0e14"/>
      <rect x="11.2" y="4" width="1.6" height="15" rx=".8" fill="#f4f7fd" opacity=".5"/>
    </svg>
  </div>
  <h1>Akasha</h1>
  <p class="sub">提瓦特 · 本地离线归档</p>

  <div class="archon" id="archon">
    <div class="god" id="god">尘世七执政</div>
    <div class="nm" id="nm">七神巡礼</div>
  </div>

  <div class="rail" id="rail"></div>
  <div class="stats" id="stats"></div>

  <div class="stages" id="stages"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="tip" id="tip">正在检查本地服务…</div>
</main>
<div class="foot" id="foot"></div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  // ── 启动阶段骨架
  var STAGES = [
    { key:'check', label:'检查服务' },
    { key:'kb',    label:'知识库' },
    { key:'voice', label:'语音' },
    { key:'chat',  label:'对话前端' }
  ];
  var stageEls = {}, box = $('stages');
  STAGES.forEach(function(s, i){
    if (i) { var d = document.createElement('div'); d.className = 'sep'; box.appendChild(d); }
    var el = document.createElement('div');
    el.className = 'sg';
    el.innerHTML = '<i></i><span>' + s.label + '</span>';
    box.appendChild(el);
    stageEls[s.key] = el;
  });
  function setStage(key, state){
    var el = stageEls[key]; if (!el) return;
    el.classList.remove('doing','done');
    if (state) el.classList.add(state);
  }
  function setProgress(p, tip){
    if (typeof p === 'number') $('bar').style.width = Math.max(0, Math.min(100, p)) + '%';
    if (tip) $('tip').textContent = tip;
  }
  setProgress(5, '正在检查本地服务…');

  // ── 数字滚动
  function countUp(el, target, ms){
    var t0 = performance.now();
    (function step(now){
      var k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(target * e).toLocaleString('en-US');
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }
  var STAT_DEFS = [
    { key:'characters',    label:'角色' },
    { key:'voices',        label:'条语音', hi:1 },
    { key:'dialogueLines', label:'句台词' },
    { key:'books',         label:'本书籍' },
    { key:'storyActs',     label:'故事线段', hi:1 }
  ];
  function renderStats(stats){
    var b = $('stats'); b.innerHTML = '';
    // 客户端模式不收集统计（服务端的规模是服务端的资产，没必要写在用户脸上），
    // 这时 stats 是 null —— 把整个区块收掉，而不是留一条空白。
    var got = STAT_DEFS.some(function(d){ return stats && stats[d.key]; });
    if (!got) { b.style.display = 'none'; return; }
    b.style.display = '';
    STAT_DEFS.forEach(function(d){
      var v = stats && stats[d.key]; if (!v) return;
      var el = document.createElement('div');
      el.className = 'st' + (d.hi ? ' hi' : '');
      el.innerHTML = '<b>0</b><span>' + d.label + '</span>';
      b.appendChild(el);
      setTimeout(function(){ countUp(el.querySelector('b'), v, 1500); }, 120);
    });
  }

  // ── 七神巡礼
  var ARCHONS = [], ai = 0, layer = 0, timer = null;

  function buildRail(){
    var rail = $('rail');
    rail.innerHTML = '';
    ARCHONS.forEach(function(a, i){
      var d = document.createElement('div');
      d.className = 'rn' + (a.src ? '' : ' locked');
      d.style.setProperty('--c', a.color || '#8aa4ff');
      d.innerHTML = '<i>' + (a.element || '?') + '</i><span>' + a.region + '</span>';
      rail.appendChild(d);
    });
  }

  function showArchon(i){
    var a = ARCHONS[i]; if (!a) return;
    document.documentElement.style.setProperty('--el', a.color || '#8aa4ff');

    // 立绘（至冬女皇没有实装立绘：保留上一张淡出，只换文字与光色）
    if (a.src) {
      var el = $(layer ? 'a1' : 'a0'), other = $(layer ? 'a0' : 'a1');
      el.style.backgroundImage = 'url("' + a.src + '")';
      el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
      other.classList.remove('on');
      layer = layer ? 0 : 1;
    }

    var ac = $('archon');
    ac.classList.remove('swap'); void ac.offsetWidth; ac.classList.add('swap');
    $('god').textContent = a.god || a.name;
    $('nm').textContent = a.src
      ? a.region + ' · ' + a.element + '神 · ' + a.name
      : a.region + ' · ' + a.element + '神 · 尚未在知识库中立绘';

    var nodes = document.querySelectorAll('.rn');
    for (var k = 0; k < nodes.length; k++) nodes[k].classList.toggle('on', k === i);
  }
  function nextArchon(){ ai = (ai + 1) % Math.max(1, ARCHONS.length); showArchon(ai); }

  function startArchons(list){
    if (!list || !list.length) return;
    ARCHONS = list;
    buildRail();
    showArchon(0);
    clearInterval(timer);
    timer = setInterval(nextArchon, 3400);      // 6.5s 的启动页里能完整轮两轮
  }

  // ── 主进程事件
  if (window.boot) {
    window.boot.onStage(function(d){
      if (!d) return;
      if (d.key) setStage(d.key, d.state);
      setProgress(d.progress, d.tip);
    });
    window.boot.onData(function(d){
      if (!d) return;
      if (d.stats) renderStats(d.stats);
      if (d.archons && d.archons.length) startArchons(d.archons);
      if (d.foot) $('foot').textContent = d.foot;
    });
  }

  window.__ready = function(msg){
    setProgress(100, msg || '准备就绪');
    STAGES.forEach(function(s){ setStage(s.key, 'done'); });
    setTimeout(function(){ document.body.classList.add('out'); }, 700);
  };

  // 点击任意处跳过开场动画（游戏 splash 的惯例）
  function skip(){
    if (window.__skipped) return;
    window.__skipped = true;
    clearInterval(timer);
    if (window.boot && window.boot.skip) window.boot.skip();
  }
  document.addEventListener('click', skip, { once: true });
  document.addEventListener('keydown', skip, { once: true });
  var hint = document.createElement('div');
  hint.textContent = '点击任意处跳过';
  hint.style.cssText = 'position:fixed;right:20px;bottom:16px;font-size:11.5px;' +
    'color:#4b5563;letter-spacing:.08em;animation:blink 2.6s ease-in-out infinite';
  var st = document.createElement('style');
  st.textContent = '@keyframes blink{0%,100%{opacity:.45}50%{opacity:.95}}';
  document.head.appendChild(st);
  document.body.appendChild(hint);
})();
</script>
</body>
</html>
